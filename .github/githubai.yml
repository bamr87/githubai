# GitHubAI configuration for this repository (dogfooding the framework).
# Schema reference: docs/configuration.md — merged over profiles/_base.yml
# and profiles/template.yml by actions/load-config.

version: 1

repo:
  type: template
  purpose: >-
    GitHubAI itself - the Claude Code SDLC framework other repositories
    adopt. Consumers reference the workflows, action, and profiles in this
    repo at a ref, so everything here is public API.
  primary_language: yaml

claude:
  model: ""
  # Weekly maintenance runs five tasks in ONE agent invocation (docs_drift,
  # todo_sweep, dependency_report, stale_nudge, health_report), each costing
  # several gh/grep round trips. It outgrew 60: the 2026-09-07 run reported a
  # successful result after 68 turns and the action failed it for exceeding the
  # cap, discarding work that was already done. 100 leaves headroom as this repo
  # keeps growing; `timeout-minutes: 45` on each job is the real cost backstop
  # (that 68-turn run took 8m17s).
  max_turns: 100

automation:
  triage:
    enabled: true
  implement:
    enabled: true
  review:
    enabled: true
  auto_merge:
    enabled: true
    allowed_paths:
      - "docs/**"
      - "**/*.md"
      - ".github/dependabot.yml"
  maintenance:
    enabled: true
  release:
    enabled: true

standards:
  test_command: python3 -m pytest -q
  lint_command: python3 tools/unwrap-prose.py --check
  required_files:
    - README.md
    - LICENSE
    - CLAUDE.md
    - docs/README.md
