name: Claude

# GitHubAI - interactive entry point. Mention @claude in an issue or PR
# comment (or open/assign an issue containing @claude) and Claude Code picks
# up the task with full repo context. Repo standards reach Claude through
# CLAUDE.md in the checkout; the automation workflows (claude-*.yml) inject
# profile standards explicitly.
#
# Auth (framework convention): CLAUDE_CODE_OAUTH_TOKEN (from
# `claude setup-token`) only, for now — ANTHROPIC_API_KEY is disabled
# (2026-11-15) and no longer used even when the OAuth token is absent.
# See docs/security.md.
#
# Guardrails (fleet harness standard, bamr87/bamr87 docs/HARNESS-OPS.md): only
# an owner, member or collaborator can start a run, the model is an exact id,
# and each run has a dollar ceiling. The gate and both values are the ones the
# fleet's agent-context kit ships (bamr87/bamr87 templates/agent-context/);
# this file is not the kit's copy, because it is also a reusable workflow.
#
# Reusable: call from any repo as
#   uses: bamr87/githubai/.github/workflows/claude.yml@main
#   secrets: inherit

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude Code OAuth token from `claude setup-token` (preferred)
        required: false
      # Claude auth: OAuth only (CLAUDE_CODE_OAUTH_TOKEN). ANTHROPIC_API_KEY disabled for now (2026-11-15); to restore, re-add the secrets.ANTHROPIC_API_KEY reference.
      # Still declared so callers that pass it explicitly don't fail; it is ignored.
      ANTHROPIC_API_KEY:
        description: Ignored for now (OAuth only; ANTHROPIC_API_KEY disabled 2026-11-15)
        required: false
      AGENT_APP_CLIENT_ID:
        description: Client id of the agent identity App (app/identity/). With AGENT_APP_PRIVATE_KEY the lane writes as that App's bot; without both it writes as before
        required: false
      AGENT_APP_PRIVATE_KEY:
        description: Private key of the agent identity App (app/identity/)
        required: false

permissions:
  contents: read

jobs:
  claude:
    # Only trusted authors can start a run. claude-code-action itself refuses an
    # actor without write access, but only once the job is running, and it
    # checks who caused the event, not who wrote the text: a maintainer
    # assigning a stranger's issue would hand that issue's @claude text to the
    # agent. So the author_association is read from the object that carries the
    # @claude text (the comment, the review, or the issue itself), and it must
    # be an owner, a member or a collaborator.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    # Job-level, not workflow-level: comments that don't mention @claude
    # (including Claude's own) skip this job, and a skipped run must not take
    # the pending slot and cancel a queued real request on the same thread.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    env:
      # The agent identity App (app/identity/): both secrets set means this lane
      # writes as that App's bot, so its work is authored by an identity you can
      # review and approve; either one missing keeps the lane exactly as before.
      HAS_AGENT_APP: ${{ secrets.AGENT_APP_CLIENT_ID != '' && secrets.AGENT_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check out GitHubAI framework (version-matched)
        uses: actions/checkout@v7
        with:
          repository: bamr87/githubai
          # Reusable call: SHA of the called workflow's ref; direct run in
          # this repo: the current SHA. The identity action always matches the
          # workflow that is executing (no @main skew, testable in PRs).
          ref: ${{ github.job_workflow_sha || github.sha }}
          path: .githubai-framework
          persist-credentials: false

      - name: Mint the agent identity token
        id: agent-token
        if: env.HAS_AGENT_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: Resolve the agent identity
        id: identity
        uses: ./.githubai-framework/actions/agent-identity
        with:
          app-token: ${{ steps.agent-token.outputs.token }}
          app-slug: ${{ steps.agent-token.outputs.app-slug }}

      - name: Remove framework checkout
        run: rm -rf .githubai-framework

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude auth: OAuth only (CLAUDE_CODE_OAUTH_TOKEN). ANTHROPIC_API_KEY disabled for now (2026-11-15); to restore, re-add the secrets.ANTHROPIC_API_KEY reference.
          # Who the lane writes as: the agent identity App's token and bot when it is
          # configured, else empty and the action's defaults (its own OIDC App token).
          github_token: ${{ steps.agent-token.outputs.token }}
          bot_id: ${{ steps.identity.outputs.bot-id }}
          bot_name: ${{ steps.identity.outputs.bot-name }}
          # The model is an exact id from the fleet's allowlist (bamr87/bamr87
          # _data/fleet.yml `ai_models.allowed`), never an alias and never the
          # action's default of the day. The dollar ceiling is a circuit
          # breaker, not a budget: a mention is human-triggered, so there is no
          # turn cap to size it against, but it is unattended spend the moment
          # the person who wrote it walks away.
          claude_args: "--model claude-sonnet-5-5 --max-budget-usd 20"
