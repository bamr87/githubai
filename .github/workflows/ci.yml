name: CI

# GitHubAI self-tests: validate profiles, config loader, workflow
# conventions (OAuth-first auth, permissions, pinning), template stubs,
# the installer, and the GitHub App relay. Markdown prose style is
# enforced separately by markdown-oneline.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest -q

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Syntax-check and lint shell scripts
        run: |
          bash -n setup/install.sh
          shellcheck setup/install.sh

  relay:
    # The GitHub App relay (app/relay/) has no dependencies and no build step,
    # so its suite runs on a bare Node - routing parity with Actions mode,
    # org policy, sessions, tenant isolation, and the webhook pipeline.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run relay tests
        working-directory: app/relay
        run: npm test
