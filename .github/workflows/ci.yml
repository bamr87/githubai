name: CI

# Adopted from bamr87/bamr87 via the standard-ci kit. This is a thin caller —
# the gate logic is shared and versioned in
# bamr87/bamr87/.github/workflows/standard-ci.yml. Don't edit the logic here.
#
# What the shared gate runs for this repo: it detects pyproject.toml, installs
# requirements-dev.txt, and runs `pytest -q` (the same 41 self-tests that
# validate profiles, the config loader, workflow conventions, template stubs,
# and the installer). Python version resolves from vars.PYTHON_VERSION (3.12).
#
# NOT covered by the shared gate, kept as dedicated workflows:
#   shell.yml            — bash -n + shellcheck on setup/install.sh
#   markdown-oneline.yml — markdown prose style (tools/unwrap-prose.py --check)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: bamr87/bamr87/.github/workflows/standard-ci.yml@main
    secrets: inherit
