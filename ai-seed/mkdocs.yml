site_name: AI-Seed Documentation
site_description: The autonomous AI orchestration framework — plant, germinate, grow
site_url: https://bamr87.github.io/ai-seed
repo_url: https://github.com/bamr87/ai-seed

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - toc.integrate
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_category_heading: true
  - gen-files:
      scripts:
        - scripts/generate_docs.py
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - def_list
  - footnotes
  - md_in_html

nav:
  - Home: index.md
  - Framework:
    - Architecture: ARCHITECTURE.md
    - Pattern provenance: PATTERNS.md
  - Example app (legacy):
    - Developer guide: DEVELOPER_GUIDE.md
    - API: API.md
    - Implementation notes: architecture/IMPLEMENTATION.md
    - Periodic growth (historical): guides/periodic-growth-workflows.md
  - API Reference: reference/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bamr87/ai-seed-repo
  version:
    provider: mike
