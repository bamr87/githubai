# =============================================================================
# seed-steward.yml — the @claude mention handler (kernel v__SEED_KERNEL_VERSION__)
# =============================================================================
# The TEND surface: mention @claude in an issue or PR comment and Claude Code
# picks up the task. The mention is the consent — no enable variable — but the
# .seed/pause.yml kill switch is honored, and CLAUDE.md's guardrails bind the
# agent (PR-only, never merge, quarantine untrusted text, workflows untouchable).
#
# Auth (house convention): CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)
# preferred; ANTHROPIC_API_KEY used only when the OAuth token is absent.
# Adapted from bamr87/bamr87 templates/agent-context (kit v0.4.0).
# Kernel-managed: rendered from seed/kernel/ by the AI-Seed planter.

name: seed-steward

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

# One Claude run at a time per issue/PR thread. Without this, several @claude
# mentions in quick succession each spin up their own agent against the same
# thread, racing each other on the same branch. Deliberately NOT
# cancel-in-progress: each mention is a distinct request; a superseded run
# queues rather than dying mid-push.
concurrency:
  group: seed-steward-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  steward:
    if: |
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
       (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
       (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
       (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))) &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Honor the kill switch
        run: |
          if grep -qE '^paused:[[:space:]]*true' .seed/pause.yml 2>/dev/null; then
            echo "::error::seed is PAUSED via .seed/pause.yml — steward refuses to run."
            exit 1
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
